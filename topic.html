<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic · The 3C Repository</title>
  <meta name="description" content="Every resource in one topic, by how you want to learn: watch, read, do, study or dig into papers.">
  <script>
    try { var t = localStorage.getItem('3c-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .topic-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; margin-top: 12px; padding: 18px; background: var(--card); border: var(--rule); }
    .block { min-width: 104px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; background: var(--acc); color: var(--on-acc); box-shadow: inset 0 6px 0 var(--band); }
    .block .sym { font-size: 56px; line-height: .9; }
    .topic-head__text { flex: 1 1 420px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
    .topic-head h1 { font-size: clamp(30px, 4vw, 48px); }
    .topic-head p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 760px; }
    .ticked { align-self: center; padding: 10px 14px; border: var(--rule); font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
    .filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 28px; padding: 14px 0; border-bottom: var(--rule); }
    .filters .label.count { margin-left: auto; }
    .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); margin-top: 16px; border-left: var(--rule); border-top: var(--rule); }
    .lane { display: flex; flex-direction: column; min-width: 0; border-right: var(--rule); border-bottom: var(--rule); background: var(--card); }
    .lane__head { background: var(--ink); color: var(--paper); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .lane__head h2 { font-size: 24px; }
    .lane__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .lane__bar { height: 4px; background: rgba(127,127,127,.35); }
    .lane__bar span { display: block; height: 100%; background: var(--hi); }
    .item { display: flex; gap: 10px; padding: 12px 14px; border-top: var(--rule-hair); }
    .item:first-of-type { border-top: 0; }
    .item.done { background: var(--done-bg); }
    .item.done .item__title { text-decoration: line-through; }
    .item__body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .item__title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .item__title:hover { text-decoration: underline; text-underline-offset: 3px; }
    .item__desc { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .lane__empty { margin: 0; padding: 14px; font-size: 14px; font-style: italic; color: var(--muted); }
    .notfound { padding: 40px 0; font-size: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <a class="masthead__logo" href="index.html" aria-label="3C home"><span class="sym">3C</span></a>
      <div class="masthead__title">
        <span class="display">The 3C Repository</span>
        <span class="label muted" id="crumb"><a href="index.html">Front page</a></span>
      </div>
      <nav class="masthead__nav" aria-label="Primary">
        <a href="index.html">Front page</a>
        <a href="library.html">Library</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">Dark</button>
      </nav>
    </header>

    <main id="main">
      <section class="topic-head" id="head" aria-labelledby="topic-h"><p class="muted">Loading…</p></section>

      <div class="filters" role="group" aria-label="Filters">
        <div class="field">
          <span class="label">Level</span>
          <div class="seg" role="group" aria-label="Filter by level" id="level-chips"></div>
        </div>
        <div class="field">
          <span class="label">How do you want to learn?</span>
          <div class="pills" role="group" aria-label="Filter by format" id="format-chips"></div>
        </div>
        <span class="label muted count" id="shown" aria-live="polite"></span>
      </div>

      <div class="lanes" id="lanes"></div>
    </main>

    <footer class="site-footer">
      Ticks are saved in this browser only, so nobody else sees them. Entries live in a shared Google Doc and sync here automatically.
    </footer>
  </div>

  <script type="module" src="js/topic.js"></script>
</body>
</html>
